<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | JOYTI - SNIPER PREMIUM WEAR</title>

<style>
body{font-family:Arial;margin:0;background:#f4f3ea;color:#171a14}
.wrap{max-width:1100px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:#fff;padding:18px;border-radius:12px;margin:18px 0;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:11px;box-sizing:border-box;margin:5px 0 10px;border:1px solid #bbb;border-radius:6px}
button{padding:10px 14px;border:0;border-radius:6px;background:#596442;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.danger{background:#8b3d35}
.muted{color:#666;font-size:13px}
.item{border:1px solid #ddd;padding:12px;border-radius:8px}
.item img{width:100%;height:150px;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.order{border:1px solid #ddd;padding:12px;border-radius:8px;margin:10px 0}
.status{font-weight:800}
.hide{display:none}
.preview{max-width:180px;max-height:180px;margin:8px 0;border-radius:8px;display:none}
#uploadMsg{margin-top:8px}
@media(max-width:600px){
.top{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<div>
<h1>JOYTI Admin Panel</h1>
<div class="muted">Products • Orders • Shiprocket</div>
</div>

<button onclick="location.href='/'">
Open Website
</button>

</div>

<div id="login" class="panel">

<h2>Admin Login</h2>

<p class="muted">
Enter your admin password.
</p>

<input
id="pw"
type="password"
placeholder="Admin password"
>

<button onclick="login()">
LOGIN
</button>

<p id="msg"></p>

</div>

<div id="app" class="hide">

<div class="panel">

<h2>Products</h2>

<div class="grid" id="products"></div>

<hr>

<h3>Add / Edit Product</h3>

<input type="hidden" id="pid">

<div class="grid">

<div>
<label>Name</label>
<input
id="name"
placeholder="Product name"
>
</div>

<div>
<label>Price (₹)</label>
<input
id="price"
type="number"
placeholder="299"
>
</div>

<div>
<label>Size</label>
<input
id="sizes"
placeholder="M, L, XL"
>
</div>

<div>
<label>Fabric</label>
<input
id="fabric"
placeholder="Cotton Lycra"
>
</div>

<div>
<label>Photo URL</label>
<input
id="img"
placeholder="https://..."
>
</div>

<div>

<label>Product Photo</label>

<input
id="photoFile"
type="file"
accept="image/*"
>

<img
id="preview"
class="preview"
>

</div>

<div>

<label>Description</label>

<input
id="desc"
value="Premium quality"
>

</div>

</div>

<div class="row">

<button onclick="saveProduct()">
SAVE PRODUCT
</button>

<button onclick="clearForm()">
CLEAR
</button>

</div>

<p id="uploadMsg" class="muted"></p>

</div>


<div class="panel">

<h2>Orders</h2>

<button onclick="loadOrders()">
REFRESH ORDERS
</button>

<div id="orders"></div>

</div>

</div>

</div>


<script>

let token='';


/* API */

const api=(u,o={})=>
fetch(u,{
...o,
headers:{
'Content-Type':'application/json',
...(o.headers||{}),
Authorization:'Bearer '+token
}
});


/* LOGIN */

async function login(){

const password=
document.getElementById('pw').value;

const r=
await fetch('/api/admin-login',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:
JSON.stringify({
password
})
});

const d=
await r.json();

if(!r.ok){

document.getElementById('msg')
.textContent=
d.error||'Login failed';

return;

}

token=password;

localStorage.setItem(
'adminToken',
token
);

document.getElementById('login')
.classList.add('hide');

document.getElementById('app')
.classList.remove('hide');

loadProducts();
loadOrders();

}


/* LOAD PRODUCTS */

async function loadProducts(){

try{

const r=
await api('/api/products');

if(r.status===401){

logout();
return;

}

const d=
await r.json();

document.getElementById('products')
.innerHTML=
(d.products||[]).map(p=>`

<div class="item">

${p.img ? `
<img
src="${p.img}"
alt="${p.name||'Product'}"
onerror="this.style.display='none'"
>
` : ''}

<b>
${p.name||''}
</b>

<div>
₹${Number(p.price||0)}
</div>

<div>
<b>Size:</b>
${p.sizes||'Not specified'}
</div>

<div>
<b>Fabric:</b>
${p.fabric||'Not specified'}
</div>

<div class="muted">
${p.description||''}
</div>

<div class="row">

<button
onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'
>
EDIT
</button>

<button
class="danger"
onclick="deleteProduct(${p.id})"
>
DELETE
</button>

</div>

</div>

`).join('');

}catch(error){

console.error(error);

}

}


/* EDIT PRODUCT */

function editProduct(p){

document.getElementById('pid').value=
p.id;

document.getElementById('name').value=
p.name||'';

document.getElementById('price').value=
p.price||'';

document.getElementById('sizes').value=
p.sizes||'';

document.getElementById('fabric').value=
p.fabric||'';

document.getElementById('img').value=
p.img||'';

document.getElementById('desc').value=
p.description||'Premium quality';

document.getElementById('photoFile').value='';

document.getElementById('preview')
.style.display='none';

document.getElementById('uploadMsg')
.textContent='';

scrollTo(
0,
document.body.scrollHeight
);

}


/* CLEAR */

function clearForm(){

[
'pid',
'name',
'price',
'sizes',
'fabric',
'img'
].forEach(
x=>
document.getElementById(x).value=''
);

document.getElementById('photoFile')
.value='';

document.getElementById('preview')
.style.display='none';

document.getElementById('uploadMsg')
.textContent='';

document.getElementById('desc')
.value='Premium quality';

}


/* PHOTO PREVIEW */

document.getElementById('photoFile')
.addEventListener(
'change',
function(){

const file=this.files[0];

if(!file)return;

const preview=
document.getElementById('preview');

preview.src=
URL.createObjectURL(file);

preview.style.display='block';

}
);


/* UPLOAD PHOTO */

async function uploadPhoto(){

const file=
document.getElementById('photoFile')
.files[0];

if(!file)return null;

const msg=
document.getElementById('uploadMsg');

msg.textContent=
'Uploading photo...';


const dataUrl=
await new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=()=>{
resolve(
reader.result
);
};

reader.onerror=()=>{
reject(
new Error(
'Photo read failed'
)
);
};

reader.readAsDataURL(file);

}
);


const r=
await fetch(
'/api/upload',
{

method:'POST',

headers:{
'Content-Type':
'application/json',

'Authorization':
'Bearer '+token
},

body:
JSON.stringify({

data:dataUrl,

contentType:file.type

})

}
);


const d=
await r.json();


if(!r.ok){

throw new Error(
d.error||
'Photo upload failed'
);

}


msg.textContent=
'Photo uploaded successfully';


return '/api/product-image?key='+
encodeURIComponent(
d.pathname
);

}


/* SAVE PRODUCT */

async function saveProduct(){

try{

let imageUrl=
document.getElementById('img')
.value;

const file=
document.getElementById('photoFile')
.files[0];

if(file){

imageUrl=
await uploadPhoto();

}


const body={

id:
Number(
document.getElementById('pid')
.value
)||undefined,

name:
document.getElementById('name')
.value,

price:
Number(
document.getElementById('price')
.value
),

sizes:
document.getElementById('sizes')
.value,

fabric:
document.getElementById('fabric')
.value,

img:imageUrl,

description:
document.getElementById('desc')
.value

};


if(!body.name.trim()){

alert(
'Product name is required'
);

return;

}


if(
!Number.isFinite(body.price) ||
body.price<=0
){

alert(
'Valid price is required'
);

return;

}


const method=
body.id?'PUT':'POST';


const r=
await api(
'/api/products',
{

method,

body:
JSON.stringify(body)

}
);


const d=
await r.json();


if(!r.ok){

alert(
d.error||
'Save failed'
);

return;

}


alert(
'Product saved successfully'
);

clearForm();

loadProducts();


}catch(error){

alert(
error.message||
'Something went wrong'
);

}

}


/* DELETE */

async function deleteProduct(id){

if(!confirm(
'Delete this product?'
))return;


const r=
await api(
'/api/products?id='+id,
{
method:'DELETE'
}
);


if(!r.ok){

const d=
await r.json();

alert(
d.error||
'Delete failed'
);

return;

}


loadProducts();

}


/* LOAD ORDERS */

async function loadOrders(){

const r=
await api('/api/orders');


if(!r.ok){

document.getElementById('orders')
.textContent=
'Unable to load orders';

return;

}


const d=
await r.json();


document.getElementById('orders')
.innerHTML=
(d.orders||[]).map(o=>`

<div class="order">

<b>
${o.customer?.name||'Customer'}
</b>

— ₹${o.amount}

— <span class="status">
${o.status||'Payment Pending'}
</span>


<div>
${o.customer?.mobile||''}
</div>


<div>
${o.address||''},
${o.pin||''}
</div>


<div class="muted">

${o.items?.map(
i=>`${i.name} × ${i.qty}`
).join(', ')||''}

</div>


<div class="muted">

Razorpay:
${o.paymentId||'Pending'}

|

Shiprocket:
${o.shiprocketOrderId||'Not created'}

</div>


<div class="row">


<select id="s-${o.id}">

<option>
Payment Pending
</option>

<option>
Paid
</option>

<option>
Ready to Ship
</option>

<option>
Shipped
</option>

<option>
Delivered
</option>

<option>
Cancelled
</option>

</select>


<button
onclick="statusUpdate('${o.id}')"
>
UPDATE STATUS
</button>


<button
onclick="verifyPayment('${o.id}')"
>
VERIFY PAYMENT
</button>


<button
onclick="ship('${o.id}')"
>
SEND TO SHIPROCKET
</button>


</div>

</div>

`).join('');


(d.orders||[]).forEach(
o=>{

const s=
document.getElementById(
's-'+o.id
);

if(s){

s.value=
o.status||
'Payment Pending';

}

}
);

}


/* UPDATE STATUS */

async function statusUpdate(id){

const select=
document.getElementById(
's-'+id
);

if(!select)return;


const status=
select.value;


const r=
await api(
'/api/orders',
{

method:'PATCH',

body:
JSON.stringify({

id,
status

})

}
);


if(!r.ok){

const d=
await r.json();

alert(
d.error||
'Update failed'
);

return;

}


loadOrders();

}


/* VERIFY PAYMENT */

async function verifyPayment(id){

if(!confirm(
'Check this order payment in Razorpay?'
)){

return;

}


const r=
await api(
'/api/payment-status',
{

method:'POST',

body:
JSON.stringify({

orderId:id

})

}
);


const d=
await r.json();


if(!r.ok){

alert(
d.error||
'Payment check failed'
);

return;

}


if(d.paid){

alert(
'Payment verified successfully. Order is now PAID.'
);

}else{

alert(
'No captured payment found. Order is still Payment Pending.'
);

}


loadOrders();

}


/* SHIPROCKET */

async function ship(id){

if(!confirm(
'Create this order in Shiprocket?'
)){

return;

}


const r=
await api(
'/api/shiprocket',
{

method:'POST',

body:
JSON.stringify({

orderId:id

})

}
);


const d=
await r.json();


if(!r.ok){

alert(
d.error||
d.message||
'Shiprocket error'
);

return;

}


alert(
'Shiprocket order created successfully'
);

loadOrders();

}


/* LOGOUT */

function logout(){

token='';

localStorage.removeItem(
'adminToken'
);

location.reload();

}


/* SAVED LOGIN */

const saved=
localStorage.getItem(
'adminToken'
);


if(saved){

token=saved;

loginWithSaved();

}


/* AUTO LOGIN */

async function loginWithSaved(){

const r=
await api('/api/orders');


if(r.ok){

document.getElementById('login')
.classList.add('hide');

document.getElementById('app')
.classList.remove('hide');

loadProducts();

loadOrders();

}else{

logout();

}

}

</script>

</body>
</html>

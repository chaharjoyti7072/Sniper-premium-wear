<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | JOYTI - SNIPER PREMIUM WEAR</title>

<style>
body{font-family:Arial;margin:0;background:#f4f3ea;color:#171a14}
.wrap{max-width:1100px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:#fff;padding:18px;border-radius:12px;margin:18px 0;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:11px;box-sizing:border-box;margin:5px 0 10px;border:1px solid #bbb;border-radius:6px}
button{padding:10px 14px;border:0;border-radius:6px;background:#596442;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.danger{background:#8b3d35}
.verify{background:#596442}
.muted{color:#666;font-size:13px}
.item{border:1px solid #ddd;padding:12px;border-radius:8px}
.item img{width:100%;height:150px;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.order{border:1px solid #ddd;padding:12px;border-radius:8px;margin:10px 0}
.status{font-weight:800}
.hide{display:none}
.preview{max-width:180px;max-height:180px;margin:8px 0;border-radius:8px;display:none}
#uploadMsg{margin-top:8px}
#orders:empty:after{content:"No orders yet.";color:#777}
@media(max-width:600px){
.top{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<div>
<h1>JOYTI Admin Panel</h1>
<div class="muted">Products • Orders • Shiprocket</div>
</div>

<button onclick="location.href='/'">
Open Website
</button>
</div>


<div id="login" class="panel">

<h2>Admin Login</h2>

<p class="muted">
Enter your admin password.
</p>

<input
id="pw"
type="password"
placeholder="Admin password"
>

<button onclick="login()">
LOGIN
</button>

<p id="msg"></p>

</div>


<div id="app" class="hide">


<!-- PRODUCTS -->

<div class="panel">

<h2>Products</h2>

<div class="grid" id="products"></div>

<hr>

<h3>Add / Edit Product</h3>

<input type="hidden" id="pid">

<div class="grid">

<div>
<label>Name</label>
<input
id="name"
placeholder="Product name"
>
</div>

<div>
<label>Price (₹)</label>
<input
id="price"
type="number"
placeholder="299"
>
</div>

<div>
<label>Size</label>
<input
id="sizes"
placeholder="M, L, XL"
>
</div>

<div>
<label>Fabric</label>
<input
id="fabric"
placeholder="Cotton Lycra"
>
</div>

<div>
<label>Photo URL</label>
<input
id="img"
placeholder="https://..."
>
</div>

<div>

<label>Product Photo</label>

<input
id="photoFile"
type="file"
accept="image/*"
>

<img
id="preview"
class="preview"
>

</div>

<div>

<label>Description</label>

<input
id="desc"
value="Premium quality"
>

</div>

</div>


<div class="row">

<button onclick="saveProduct()">
SAVE PRODUCT
</button>

<button onclick="clearForm()">
CLEAR
</button>

</div>

<p id="uploadMsg" class="muted"></p>

</div>


<!-- ORDERS -->

<div class="panel">

<h2>Orders</h2>

<button onclick="loadOrders()">
REFRESH ORDERS
</button>

<div id="orders"></div>

</div>

</div>

</div>


<script>

let token='';


/* =========================
   API HELPER
========================= */

const api=(url,options={})=>{

return fetch(
url,
{
...options,
headers:{
...(options.headers||{}),
'Content-Type':'application/json',
'Authorization':'Bearer '+token
}
}
);

};


/* =========================
   LOGIN
========================= */

async function login(){

try{

const password=
document.getElementById('pw').value.trim();

if(!password){

document.getElementById('msg')
.textContent=
'Please enter password';

return;

}


const r=
await fetch(
'/api/admin-login',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:
JSON.stringify({
password:password
})
}
);


const d=
await r.json();


if(!r.ok){

document.getElementById('msg')
.textContent=
d.error||
'Login failed';

return;

}


token=password;

localStorage.setItem(
'adminToken',
token
);


document.getElementById('login')
.classList.add('hide');

document.getElementById('app')
.classList.remove('hide');


await loadProducts();

await loadOrders();


}catch(error){

alert(
error.message||
'Login error'
);

}

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

try{

const r=
await api('/api/products');


if(r.status===401){

logout();

return;

}


const d=
await r.json();


const list=
Array.isArray(d.products)
?d.products
:[];


const el=
document.getElementById('products');


if(!list.length){

el.innerHTML=
'<div class="muted">No products added yet.</div>';

return;

}


el.innerHTML=
list.map(p=>`

<div class="item">

${
p.img
?
`
<img
src="${p.img}"
alt="${escapeHtml(p.name||'Product')}"
onerror="this.style.display='none'"
>
`
:
''
}


<b>
${escapeHtml(p.name||'')}
</b>


<div>
₹${Number(p.price||0).toLocaleString('en-IN')}
</div>


<div>
<b>Size:</b>
${escapeHtml(p.sizes||'Not specified')}
</div>


<div>
<b>Fabric:</b>
${escapeHtml(p.fabric||'Not specified')}
</div>


<div class="muted">
${escapeHtml(p.description||'')}
</div>


<div class="row">

<button
onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'
>
EDIT
</button>


<button
class="danger"
onclick="deleteProduct(${Number(p.id)})"
>
DELETE
</button>

</div>

</div>

`).join('');


}catch(error){

console.error(error);

document.getElementById('products')
.innerHTML=
'<div class="muted">Unable to load products.</div>';

}

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(p){

document.getElementById('pid').value=
p.id||'';

document.getElementById('name').value=
p.name||'';

document.getElementById('price').value=
p.price||'';

document.getElementById('sizes').value=
p.sizes||'';

document.getElementById('fabric').value=
p.fabric||'';

document.getElementById('img').value=
p.img||'';

document.getElementById('desc').value=
p.description||
'Premium quality';

document.getElementById('photoFile')
.value='';

document.getElementById('preview')
.style.display='none';

document.getElementById('uploadMsg')
.textContent='';


window.scrollTo(
{
top:document.body.scrollHeight,
behavior:'smooth'
}
);

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

[
'pid',
'name',
'price',
'sizes',
'fabric',
'img'
].forEach(
id=>{
document.getElementById(id).value='';
}
);


document.getElementById('photoFile')
.value='';

document.getElementById('preview')
.style.display='none';

document.getElementById('uploadMsg')
.textContent='';

document.getElementById('desc')
.value=
'Premium quality';

}


/* =========================
   IMAGE PREVIEW
========================= */

document.getElementById('photoFile')
.addEventListener(
'change',
function(){

const file=
this.files[0];

if(!file){

return;

}


const preview=
document.getElementById('preview');


preview.src=
URL.createObjectURL(file);

preview.style.display=
'block';

}
);


/* =========================
   IMAGE UPLOAD
========================= */

async function uploadPhoto(){

const file=
document.getElementById('photoFile')
.files[0];


if(!file){

return null;

}


const msg=
document.getElementById('uploadMsg');


msg.textContent=
'Uploading photo...';


const dataUrl=
await new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=
()=>{
resolve(
reader.result
);
};


reader.onerror=
()=>{
reject(
new Error(
'Photo read failed'
)
);
};


reader.readAsDataURL(file);

}
);


const r=
await fetch(
'/api/upload',
{

method:'POST',

headers:{
'Content-Type':
'application/json',

'Authorization':
'Bearer '+token
},

body:
JSON.stringify({

data:dataUrl,

contentType:file.type

})

}
);


const text=
await r.text();


let d={};

try{

d=
JSON.parse(text);

}catch(e){

throw new Error(
'Upload server response invalid'
);

}


if(!r.ok){

throw new Error(
d.error||
'Photo upload failed'
);

}


msg.textContent=
'Photo uploaded successfully';


return '/api/product-image?key='+
encodeURIComponent(
d.pathname
);

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

try{

let imageUrl=
document.getElementById('img')
.value.trim();


const file=
document.getElementById('photoFile')
.files[0];


if(file){

imageUrl=
await uploadPhoto();

}


const name=
document.getElementById('name')
.value.trim();


const price=
Number(
document.getElementById('price')
.value
);


if(!name){

alert(
'Product name is required'
);

return;

}


if(
!Number.isFinite(price) ||
price<=0
){

alert(
'Valid price is required'
);

return;

}


const body={

id:
Number(
document.getElementById('pid')
.value
)||undefined,

name:name,

price:price,

sizes:
document.getElementById('sizes')
.value.trim(),

fabric:
document.getElementById('fabric')
.value.trim(),

img:imageUrl,

description:
document.getElementById('desc')
.value.trim()

};


const method=
body.id
?'PUT'
:'POST';


const r=
await api(
'/api/products',
{

method:method,

body:
JSON.stringify(body)

}
);


const d=
await r.json();


if(!r.ok){

alert(
d.error||
'Save failed'
);

return;

}


alert(
'Product saved successfully'
);


clearForm();

await loadProducts();


}catch(error){

console.error(error);

alert(
error.message||
'Something went wrong'
);

}

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

if(!confirm(
'Delete this product?'
)){

return;

}


const r=
await api(
'/api/products?id='+encodeURIComponent(id),
{
method:'DELETE'
}
);


if(!r.ok){

const d=
await r.json();

alert(
d.error||
'Delete failed'
);

return;

}


await loadProducts();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

try{

const r=
await api('/api/orders');


if(!r.ok){

document.getElementById('orders')
.textContent=
'Unable to load orders';

return;

}


const d=
await r.json();


const list=
Array.isArray(d.orders)
?d.orders
:[];


if(!list.length){

document.getElementById('orders')
.innerHTML=
'<div class="muted" style="margin-top:15px">No orders yet.</div>';

return;

}


document.getElementById('orders')
.innerHTML=
list.map(o=>`

<div class="order">


<b>
${escapeHtml(
o.customer?.name||
'Customer'
)}
</b>


— ₹${Number(o.amount||0).toLocaleString('en-IN')}


— <span class="status">
${escapeHtml(
o.status||
'Payment Pending'
)}
</span>


<div>
${escapeHtml(
o.customer?.mobile||
''
)}
</div>


<div>
${escapeHtml(
o.address||
''
)},
${escapeHtml(
o.pin||
''
)}
</div>


<div class="muted">

${
o.items?.map(
i=>
`${escapeHtml(i.name||'')} × ${Number(i.qty||0)}`
).join(', ')
||''
}

</div>


<div class="muted">

Razorpay:
${escapeHtml(
o.paymentId||
'Pending'
)}

|

Shiprocket:
${escapeHtml(
o.shiprocketOrderId||
'Not created'
)}

</div>


<div class="row">


<select id="s-${escapeHtml(String(o.id))}">

<option value="Payment Pending">
Payment Pending
</option>

<option value="Paid">
Paid
</option>

<option value="Ready to Ship">
Ready to Ship
</option>

<option value="Shipped">
Shipped
</option>

<option value="Delivered">
Delivered
</option>

<option value="Cancelled">
Cancelled
</option>

</select>


<button
onclick="statusUpdate('${escapeHtml(String(o.id))}')"
>
UPDATE STATUS
</button>


<button
class="verify"
onclick="verifyPayment('${escapeHtml(String(o.id))}')"
>
VERIFY PAYMENT
</button>


<button
onclick="ship('${escapeHtml(String(o.id))}')"
>
SEND TO SHIPROCKET
</button>


</div>

</div>

`).join('');


list.forEach(o=>{

const s=
document.getElementById(
's-'+String(o.id)
);


if(s){

s.value=
o.status||
'Payment Pending';

}

});


}catch(error){

console.error(error);

document.getElementById('orders')
.textContent=
'Unable to load orders';

}

}


/* =========================
   UPDATE STATUS
========================= */

async function statusUpdate(id){

const select=
document.getElementById(
's-'+id
);


if(!select){

alert(
'Status selector not found'
);

return;

}


const status=
select.value;


const r=
await api(
'/api/orders',
{

method:'PATCH',

body:
JSON.stringify({

id:id,

status:status

})

}
);


if(!r.ok){

const d=
await r.json();

alert(
d.error||
'Update failed'
);

return;

}


alert(
'Order status updated'
);

await loadOrders();

}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment(id){

try{

if(!confirm(
'Check this order payment in Razorpay?'
)){

return;

}


/* IMPORTANT RESPONSE TEST */

alert(
'Payment checking...'
);


const r=
await fetch(
'/api/payment-status',
{

method:'POST',

headers:{
'Content-Type':
'application/json',

'Authorization':
'Bearer '+token
},

body:
JSON.stringify({

orderId:id

})

}
);


const text=
await r.text();


let d={};

try{

d=
JSON.parse(text);

}catch(error){

alert(
'Server response error:\n\n'+
text.substring(0,500)
);

return;

}


if(!r.ok){

alert(
d.error||
'Payment check failed'
);

return;

}


if(d.paid){

alert(
'✅ PAYMENT VERIFIED\n\n'+
'Payment ID: '+
(d.paymentId||'')+
'\n\nOrder status is now PAID.'
);

}else{

alert(
'❌ NO CAPTURED PAYMENT FOUND\n\n'+
'Order is still Payment Pending.'
);

}


await loadOrders();


}catch(error){

alert(
'❌ Connection / Error:\n\n'+
(error.message||
'Unknown error')
);

}

}


/* =========================
   SHIPROCKET
========================= */

async function ship(id){

if(!confirm(
'Create this order in Shiprocket?'
)){

return;

}


const r=
await api(
'/api/shiprocket',
{

method:'POST',

body:
JSON.stringify({

orderId:id

})

}
);


const text=
await r.text();


let d={};

try{

d=
JSON.parse(text);

}catch(error){

alert(
'Shiprocket server response invalid'
);

return;

}


if(!r.ok){

alert(
d.error||
d.message||
'Shiprocket error'
);

return;

}


alert(
'Shiprocket order created successfully'
);


await loadOrders();

}


/* =========================
   LOGOUT
========================= */

function logout(){

token='';

localStorage.removeItem(
'adminToken'
);

location.reload();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value||'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* =========================
   AUTO LOGIN
========================= */

const saved=
localStorage.getItem(
'adminToken'
);


if(saved){

token=saved;

loginWithSaved();

}


async function loginWithSaved(){

try{

const r=
await api('/api/orders');


if(r.ok){

document.getElementById('login')
.classList.add('hide');

document.getElementById('app')
.classList.remove('hide');

await loadProducts();

await loadOrders();

}else{

logout();

}

}catch(error){

logout();

}

}

</script>

</body>
</html>

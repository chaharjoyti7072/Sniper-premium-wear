<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | SNIPER PREMIUM WEAR</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f3ea;
  color:#171a14;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.panel{
  background:#fff;
  padding:18px;
  margin:18px 0;
  border-radius:12px;
  border:1px solid #ddd;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

input,select{
  width:100%;
  padding:11px;
  margin:5px 0 10px;
  border:1px solid #bbb;
  border-radius:7px;
}

button{
  padding:11px 15px;
  border:0;
  border-radius:7px;
  background:#596442;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.danger{
  background:#8b3d35;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.item{
  border:1px solid #ddd;
  border-radius:9px;
  padding:12px;
}

.item img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:7px;
}

.order{
  border:1px solid #ddd;
  border-radius:9px;
  padding:14px;
  margin:12px 0;
  background:#fff;
}

.status{
  font-weight:bold;
}

.muted{
  color:#666;
  font-size:13px;
  margin-top:5px;
}

.preview{
  max-width:180px;
  max-height:180px;
  display:none;
  margin:8px 0;
  border-radius:8px;
}

.message{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:7px;
  background:#eeeeE4;
}

.hide{
  display:none;
}

@media(max-width:600px){
  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .row button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
  <div>
    <h1>SNIPER PREMIUM WEAR</h1>
    <div class="muted">Admin Panel</div>
  </div>

  <button onclick="location.href='/'">
    OPEN WEBSITE
  </button>
</div>


<!-- LOGIN -->

<div id="login" class="panel">

<h2>Admin Login</h2>

<input
  id="pw"
  type="password"
  placeholder="Admin password"
>

<button onclick="login()">
LOGIN
</button>

<p id="loginMsg"></p>

</div>


<!-- APP -->

<div id="app" class="hide">


<!-- PRODUCTS -->

<div class="panel">

<h2>Products</h2>

<div id="products" class="grid"></div>

<hr>

<h3>Add / Edit Product</h3>

<input
  type="hidden"
  id="pid"
>

<div class="grid">

<div>
<label>Product Name</label>
<input
  id="name"
  placeholder="Product name"
>
</div>

<div>
<label>Price ₹</label>
<input
  id="price"
  type="number"
  placeholder="Price"
>
</div>

<div>
<label>Sizes</label>
<input
  id="sizes"
  placeholder="M L XL"
>
</div>

<div>
<label>Fabric</label>
<input
  id="fabric"
  placeholder="Cotton Lycra"
>
</div>

<div>
<label>Photo URL</label>
<input
  id="img"
  placeholder="Photo URL"
>
</div>

<div>
<label>Product Photo</label>

<input
  id="photoFile"
  type="file"
  accept="image/*"
>

<img
  id="preview"
  class="preview"
>

</div>

<div>
<label>Description</label>
<input
  id="desc"
  value="Premium quality"
>
</div>

</div>

<div class="row">

<button onclick="saveProduct()">
SAVE PRODUCT
</button>

<button onclick="clearForm()">
CLEAR
</button>

</div>

<p
  id="uploadMsg"
  class="muted"
></p>

</div>


<!-- ORDERS -->

<div class="panel">

<h2>Orders</h2>

<button
  id="refreshBtn"
  onclick="loadOrders(true)"
>
REFRESH ORDERS
</button>

<div
  id="orderMessage"
  class="message"
></div>

<div id="orders"></div>

</div>

</div>

</div>


<script>

let token = "";


/* =========================
   API
========================= */

function api(url, options = {}){

  return fetch(url, {
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {}),
      "Authorization":"Bearer " + token
    }
  });

}


/* =========================
   LOGIN
========================= */

async function login(){

  try{

    const password =
      document.getElementById("pw").value.trim();

    if(!password){

      document.getElementById("loginMsg").textContent =
        "Please enter password.";

      return;
    }

    const r = await fetch("/api/admin-login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        password:password
      })
    });

    const d = await r.json();

    if(!r.ok){

      document.getElementById("loginMsg").textContent =
        d.error || "Login failed.";

      return;
    }

    token = password;

    localStorage.setItem(
      "adminToken",
      token
    );

    document.getElementById("login")
      .classList.add("hide");

    document.getElementById("app")
      .classList.remove("hide");

    await loadProducts();
    await loadOrders();

  }catch(error){

    alert(
      "Login error:\n\n" +
      (error.message || "Unknown error")
    );

  }

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

  try{

    const r = await api("/api/products");

    if(r.status === 401){

      logout();
      return;
    }

    const d = await r.json();

    const list =
      Array.isArray(d.products)
      ? d.products
      : [];

    const box =
      document.getElementById("products");

    if(!list.length){

      box.innerHTML =
        '<div class="muted">No products added yet.</div>';

      return;
    }

    box.innerHTML = list.map(function(p){

      return `
        <div class="item">

          ${
            p.img
            ? `
              <img
                src="${safe(p.img)}"
                alt="${safe(p.name)}"
              >
            `
            : ""
          }

          <h3>${safe(p.name)}</h3>

          <div>
            ₹${Number(p.price || 0).toLocaleString("en-IN")}
          </div>

          <div>
            <b>Size:</b>
            ${safe(p.sizes || "Not specified")}
          </div>

          <div>
            <b>Fabric:</b>
            ${safe(p.fabric || "Not specified")}
          </div>

          <div class="muted">
            ${safe(p.description || "")}
          </div>

          <div class="row">

            <button
              onclick="editProductById('${jsSafe(String(p.id))}')"
            >
              EDIT
            </button>

            <button
              class="danger"
              onclick="deleteProduct('${jsSafe(String(p.id))}')"
            >
              DELETE
            </button>

          </div>

        </div>
      `;

    }).join("");

    window.productList = list;

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      '<div class="muted">Unable to load products.</div>';

  }

}


/* =========================
   EDIT PRODUCT
========================= */

function editProductById(id){

  const list =
    window.productList || [];

  const p =
    list.find(function(item){
      return String(item.id) === String(id);
    });

  if(!p){

    alert("Product not found.");
    return;
  }

  document.getElementById("pid").value =
    p.id || "";

  document.getElementById("name").value =
    p.name || "";

  document.getElementById("price").value =
    p.price || "";

  document.getElementById("sizes").value =
    p.sizes || "";

  document.getElementById("fabric").value =
    p.fabric || "";

  document.getElementById("img").value =
    p.img || "";

  document.getElementById("desc").value =
    p.description || "Premium quality";

  document.getElementById("photoFile").value =
    "";

  document.getElementById("preview").style.display =
    "none";

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


/* =========================
   CLEAR
========================= */

function clearForm(){

  document.getElementById("pid").value = "";
  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("sizes").value = "";
  document.getElementById("fabric").value = "";
  document.getElementById("img").value = "";
  document.getElementById("desc").value =
    "Premium quality";

  document.getElementById("photoFile").value = "";

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("uploadMsg").textContent =
    "";

}


/* =========================
   PHOTO PREVIEW
========================= */

document
  .getElementById("photoFile")
  .addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    const preview =
      document.getElementById("preview");

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

  });


/* =========================
   UPLOAD PHOTO
========================= */

async function uploadPhoto(){

  const file =
    document.getElementById("photoFile")
    .files[0];

  if(!file) return null;

  document.getElementById("uploadMsg")
    .textContent =
      "Uploading photo...";

  const dataUrl =
    await new Promise(function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){
          resolve(reader.result);
        };

      reader.onerror =
        function(){
          reject(
            new Error("Photo read failed")
          );
        };

      reader.readAsDataURL(file);

    });


  const r = await fetch(
    "/api/upload",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":
          "Bearer " + token
      },
      body:JSON.stringify({
        data:dataUrl,
        contentType:file.type
      })
    }
  );


  const text =
    await r.text();

  let d;

  try{

    d = JSON.parse(text);

  }catch(error){

    throw new Error(
      "Upload server response invalid"
    );

  }


  if(!r.ok){

    throw new Error(
      d.error || "Photo upload failed"
    );

  }


  document.getElementById("uploadMsg")
    .textContent =
      "Photo uploaded successfully.";

  return (
    "/api/product-image?key=" +
    encodeURIComponent(d.pathname)
  );

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  try{

    let imageUrl =
      document.getElementById("img")
      .value.trim();

    const file =
      document.getElementById("photoFile")
      .files[0];

    if(file){

      imageUrl =
        await uploadPhoto();

    }


    const name =
      document.getElementById("name")
      .value.trim();

    const price =
      Number(
        document.getElementById("price")
        .value
      );


    if(!name){

      alert(
        "Product name is required."
      );

      return;
    }


    if(
      !Number.isFinite(price) ||
      price <= 0
    ){

      alert(
        "Valid price is required."
      );

      return;
    }


    const body = {

      name:name,

      price:price,

      sizes:
        document.getElementById("sizes")
        .value.trim(),

      fabric:
        document.getElementById("fabric")
        .value.trim(),

      img:imageUrl,

      description:
        document.getElementById("desc")
        .value.trim()

    };


    const id =
      document.getElementById("pid")
      .value;

    let method = "POST";


    if(id){

      body.id = Number(id);
      method = "PUT";

    }


    const r =
      await api(
        "/api/products",
        {
          method:method,
          body:JSON.stringify(body)
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      alert(
        d.error || "Save failed."
      );

      return;
    }


    alert(
      "✅ Product saved successfully."
    );


    clearForm();

    await loadProducts();

  }catch(error){

    alert(
      "❌ Error:\n\n" +
      (error.message || "Unknown error")
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

  if(!confirm(
    "Delete this product?"
  )) return;


  try{

    const r =
      await api(
        "/api/products?id=" +
        encodeURIComponent(id),
        {
          method:"DELETE"
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      alert(
        d.error || "Delete failed."
      );

      return;
    }


    alert(
      "Product deleted."
    );

    await loadProducts();

  }catch(error){

    alert(
      error.message ||
      "Delete failed."
    );

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(showMessage){

  const btn =
    document.getElementById(
      "refreshBtn"
    );

  const message =
    document.getElementById(
      "orderMessage"
    );


  try{

    if(showMessage){

      btn.disabled = true;

      btn.textContent =
        "REFRESHING...";

      message.style.display =
        "block";

      message.textContent =
        "Loading orders...";

    }


    const r =
      await api("/api/orders");


    const text =
      await r.text();

    let d = {};

    try{

      d = JSON.parse(text);

    }catch(error){

      throw new Error(
        "Server response is not valid JSON."
      );

    }


    if(!r.ok){

      throw new Error(
        d.error ||
        "Unable to load orders."
      );

    }


    const list =
      Array.isArray(d.orders)
      ? d.orders
      : [];


    const box =
      document.getElementById(
        "orders"
      );


    if(!list.length){

      box.innerHTML =
        '<div class="muted">No orders yet.</div>';

    }else{

      box.innerHTML =
        list.map(function(o){

          const id =
            String(o.id || "");

          const customer =
            o.customer || {};

          const items =
            Array.isArray(o.items)
            ? o.items
            : [];


          return `

          <div class="order">

            <b>
              ${safe(
                customer.name ||
                o.name ||
                "Customer"
              )}
            </b>

            —
            ₹${Number(
              o.amount ||
              o.total ||
              0
            ).toLocaleString("en-IN")}

            —
            <span class="status">
              ${safe(
                o.status ||
                "Payment Pending"
              )}
            </span>


            <div>
              ${safe(
                customer.mobile ||
                o.mobile ||
                ""
              )}
            </div>


            <div>
              ${safe(
                o.address ||
                ""
              )}
              ${o.pin ? ", " + safe(o.pin) : ""}
            </div>


            <div class="muted">

              ${
                items.map(function(i){

                  return (
                    safe(i.name || "") +
                    " × " +
                    Number(i.qty || 0)
                  );

                }).join(", ")
              }

            </div>


            <div class="muted">

              Razorpay:
              ${safe(
                o.paymentId ||
                "Pending"
              )}

              |

              Shiprocket:
              ${safe(
                o.shiprocketOrderId ||
                "Not created"
              )}

            </div>


            <div class="row">

              <select
                id="status-${safe(id)}"
              >

                <option value="Payment Pending">
                  Payment Pending
                </option>

                <option value="Paid">
                  Paid
                </option>

                <option value="Ready to Ship">
                  Ready to Ship
                </option>

                <option value="Shipped">
                  Shipped
                </option>

                <option value="Delivered">
                  Delivered
                </option>

                <option value="Cancelled">
                  Cancelled
                </option>

              </select>


              <button
                onclick="statusUpdate('${jsSafe(id)}')"
              >
                UPDATE STATUS
              </button>


              <button
                onclick="verifyPayment('${jsSafe(id)}')"
              >
                VERIFY PAYMENT
              </button>


              <button
                onclick="ship('${jsSafe(id)}')"
              >
                SEND TO SHIPROCKET
              </button>

            </div>

          </div>

          `;

        }).join("");


      list.forEach(function(o){

        const select =
          document.getElementById(
            "status-" +
            String(o.id)
          );

        if(select){

          select.value =
            o.status ||
            "Payment Pending";

        }

      });

    }


    if(showMessage){

      message.style.display =
        "block";

      message.textContent =
        "✅ Orders refreshed successfully.";

      setTimeout(function(){

        message.style.display =
          "none";

      },2500);

    }


  }catch(error){

    console.error(
      "Orders error:",
      error
    );


    message.style.display =
      "block";

    message.textContent =
      "❌ " +
      (
        error.message ||
        "Unable to load orders."
      );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "REFRESH ORDERS";

  }

}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment(id){

  try{

    alert(
      "🔍 Payment checking..."
    );


    const r =
      await fetch(
        "/api/payment-status",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token
          },
          body:JSON.stringify({
            orderId:id
          })
        }
      );


    const text =
      await r.text();


    let d;

    try{

      d = JSON.parse(text);

    }catch(error){

      alert(
        "❌ Server response error:\n\n" +
        text.substring(0,500)
      );

      return;
    }


    if(!r.ok){

      alert(
        "❌ Payment check failed:\n\n" +
        (
          d.error ||
          "Unknown error"
        )
      );

      return;
    }


    if(d.paid){

      alert(
        "✅ PAYMENT VERIFIED\n\n" +
        "Payment ID: " +
        (d.paymentId || "") +
        "\n\n" +
        "Order status is now PAID."
      );

    }else{

      alert(
        "❌ NO CAPTURED PAYMENT FOUND\n\n" +
        "This order is still Payment Pending."
      );

    }


    await loadOrders(false);


  }catch(error){

    alert(
      "❌ Connection / Error:\n\n" +
      (
        error.message ||
        "Payment check failed."
      )
    );

  }

}


/* =========================
   STATUS UPDATE
========================= */

async function statusUpdate(id){

  const select =
    document.getElementById(
      "status-" + id
    );


  if(!select){

    alert(
      "Status selector not found."
    );

    return;
  }


  const status =
    select.value;


  try{

    const r =
      await api(
        "/api/orders",
        {
          method:"PATCH",
          body:JSON.stringify({
            id:id,
            status:status
          })
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      alert(
        d.error ||
        "Status update failed."
      );

      return;
    }


    alert(
      "✅ Order status updated."
    );


    await loadOrders(false);

  }catch(error){

    alert(
      error.message ||
      "Status update failed."
    );

  }

}


/* =========================
   SHIPROCKET
========================= */

async function ship(id){

  if(!confirm(
    "Create this order in Shiprocket?"
  )) return;


  try{

    /*
      IMPORTANT:
      Actual HTTP endpoint is
      /api/shiprocket-order
    */

    const r =
      await api(
        "/api/shiprocket-order",
        {
          method:"POST",
          body:JSON.stringify({
            order_id:id
          })
        }
      );


    const text =
      await r.text();


    let d = {};

    try{

      d = JSON.parse(text);

    }catch(error){}


    if(!r.ok){

      alert(
        "❌ Shiprocket error:\n\n" +
        (
          d.message ||
          d.error ||
          text.substring(0,500)
        )
      );

      return;
    }


    alert(
      "✅ Order sent to Shiprocket."
    );


    await loadOrders(false);

  }catch(error){

    alert(
      "❌ Shiprocket error:\n\n" +
      (
        error.message ||
        "Shiprocket order failed."
      )
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  token = "";

  localStorage.removeItem(
    "adminToken"
  );

  location.reload();

}


/* =========================
   SAFE HTML
========================= */

function safe(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function jsSafe(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =========================
   AUTO LOGIN
========================= */

const savedToken =
  localStorage.getItem(
    "adminToken"
  );


if(savedToken){

  token = savedToken;

  autoLogin();

}


async function autoLogin(){

  try{

    const r =
      await api("/api/orders");


    if(!r.ok){

      logout();
      return;
    }


    document.getElementById("login")
      .classList.add("hide");

    document.getElementById("app")
      .classList.remove("hide");


    await loadProducts();

    await loadOrders(false);


  }catch(error){

    logout();

  }

}

</script>

</body>
</html>
